openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: finance
    description: Restaurant income and expense tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /transactions:
    get:
      operationId: getTransactions
      tags: [finance]
      summary: List financial transactions
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [income, expense]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: month
          description: Calendar month in YYYY-MM format
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [finance]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
  /transactions/{id}:
    patch:
      operationId: updateTransaction
      tags: [finance]
      summary: Update a transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
    delete:
      operationId: deleteTransaction
      tags: [finance]
      summary: Delete a transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted transaction
        "404":
          description: Transaction not found
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [finance]
      summary: Get current month financial summary and trend
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /kitchen/state:
    get:
      operationId: getKitchenState
      tags: [kitchen]
      responses:
        "200":
          description: Ingredients, dishes with calculated costs and channel profits, and data-driven alerts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KitchenState" }
  /kitchen/ingredients:
    post:
      operationId: createIngredient
      tags: [kitchen]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngredientInput" }
      responses:
        "201":
          description: Ingredient saved
  /kitchen/ingredients/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
    put:
      operationId: updateIngredient
      tags: [kitchen]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngredientInput" }
      responses:
        "200": { description: Ingredient updated and price change recorded }
        "409": { description: Unit of an ingredient used in a dish cannot change }
    delete:
      operationId: deleteIngredient
      tags: [kitchen]
      responses:
        "204": { description: Ingredient deleted }
        "409": { description: Ingredient is used in a dish }
  /kitchen/dishes:
    post:
      operationId: createDish
      tags: [kitchen]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DishInput" }
      responses:
        "201": { description: Dish saved }
  /kitchen/dishes/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
    put:
      operationId: updateDish
      tags: [kitchen]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DishInput" }
      responses:
        "200": { description: Dish saved }
    delete:
      operationId: deleteDish
      tags: [kitchen]
      responses:
        "204": { description: Dish deleted }
  /kitchen/channels/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
    put:
      operationId: updateDeliveryChannel
      tags: [kitchen]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "200": { description: Channel fees updated }
  /openai/kitchen-advice:
    post:
      operationId: generateKitchenAdvice
      tags: [kitchen]
      summary: Generate Arabic AI advice grounded in current recipe costs and channel profits
      responses:
        "200":
          description: AI advice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KitchenAdvice" }
        "503": { description: AI service unavailable; no fabricated fallback }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Transaction:
      type: object
      required: [id, type, title, category, amount, transactionDate, note, createdAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [income, expense] }
        title: { type: string }
        category: { type: string }
        amount: { type: number }
        transactionDate: { type: string, format: date }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    TransactionInput:
      type: object
      required: [type, title, category, amount, transactionDate]
      properties:
        type: { type: string, enum: [income, expense] }
        title: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, minLength: 1, maxLength: 60 }
        amount: { type: number, exclusiveMinimum: 0 }
        transactionDate: { type: string, format: date }
        note: { type: string, maxLength: 500 }
    TransactionUpdate:
      type: object
      properties:
        type: { type: string, enum: [income, expense] }
        title: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, minLength: 1, maxLength: 60 }
        amount: { type: number, exclusiveMinimum: 0 }
        transactionDate: { type: string, format: date }
        note: { type: ["string", "null"], maxLength: 500 }
    MonthlyPoint:
      type: object
      required: [month, income, expense]
      properties:
        month: { type: string }
        income: { type: number }
        expense: { type: number }
    DashboardSummary:
      type: object
      required: [income, expense, netProfit, profitChangePercent, incomeChangePercent, transactionCount, trend]
      properties:
        income: { type: number }
        expense: { type: number }
        netProfit: { type: number }
        profitChangePercent: { type: number }
        incomeChangePercent: { type: number }
        transactionCount: { type: integer }
        trend:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
    KitchenUnit:
      type: string
      enum: [kg, g, l, ml, piece]
    IngredientInput:
      type: object
      required: [name, price, unit, wastePercent]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        price: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        unit: { $ref: "#/components/schemas/KitchenUnit" }
        wastePercent: { type: number, minimum: 0, maximum: 95 }
    Ingredient:
      allOf:
        - { $ref: "#/components/schemas/IngredientInput" }
        - type: object
          required: [id, previousPrice, priceChangePercent, usedByCount]
          properties:
            id: { type: integer }
            previousPrice: { type: [number, "null"] }
            priceChangePercent: { type: number }
            usedByCount: { type: integer }
    RecipeItemInput:
      type: object
      required: [ingredientId, quantity, unit]
      properties:
        ingredientId: { type: integer, minimum: 1 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        unit: { $ref: "#/components/schemas/KitchenUnit" }
    DishChannelPrice:
      type: object
      required: [channelId, price]
      properties:
        channelId: { type: integer, minimum: 1 }
        price: { type: number, exclusiveMinimum: 0, maximum: 100000 }
    DishInput:
      type: object
      required: [name, sellingPrice, packagingCost, items, channelPrices]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        sellingPrice: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        packagingCost: { type: number, minimum: 0, maximum: 100000 }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/RecipeItemInput" }
        channelPrices:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/DishChannelPrice" }
    RecipeLine:
      allOf:
        - { $ref: "#/components/schemas/RecipeItemInput" }
        - type: object
          required: [ingredientName, cost]
          properties:
            ingredientName: { type: string }
            cost: { type: number }
    ChannelInput:
      type: object
      required: [commissionPercent, fixedFee]
      properties:
        commissionPercent: { type: number, minimum: 0, maximum: 95 }
        fixedFee: { type: number, minimum: 0, maximum: 100000 }
    DeliveryChannel:
      allOf:
        - { $ref: "#/components/schemas/ChannelInput" }
        - type: object
          required: [id, key, name]
          properties:
            id: { type: integer }
            key: { type: string, enum: [local, talabat, deliveroo] }
            name: { type: string }
    ChannelProfit:
      type: object
      required: [channelId, channelName, sellingPrice, commission, fixedFee, netRevenue, profit, marginPercent, breakEvenPrice, suggestedPrice]
      properties:
        channelId: { type: integer }
        channelName: { type: string }
        sellingPrice: { type: number }
        commission: { type: number }
        fixedFee: { type: number }
        netRevenue: { type: number }
        profit: { type: number }
        marginPercent: { type: number }
        breakEvenPrice: { type: number }
        suggestedPrice: { type: [number, "null"] }
    Dish:
      type: object
      required: [id, name, sellingPrice, packagingCost, ingredientCost, totalCost, items, channelPrices, profits]
      properties:
        id: { type: integer }
        name: { type: string }
        sellingPrice: { type: number }
        packagingCost: { type: number }
        ingredientCost: { type: number }
        totalCost: { type: number }
        items:
          type: array
          items: { $ref: "#/components/schemas/RecipeLine" }
        channelPrices:
          type: array
          items: { $ref: "#/components/schemas/DishChannelPrice" }
        profits:
          type: array
          items: { $ref: "#/components/schemas/ChannelProfit" }
    KitchenAlert:
      type: object
      required: [id, kind, severity, title, message, dishId, ingredientId]
      properties:
        id: { type: string }
        kind: { type: string, enum: [loss, price_increase, pricing] }
        severity: { type: string, enum: [danger, warning, info] }
        title: { type: string }
        message: { type: string }
        dishId: { type: [integer, "null"] }
        ingredientId: { type: [integer, "null"] }
    KitchenState:
      type: object
      required: [ingredients, dishes, channels, alerts]
      properties:
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
        dishes:
          type: array
          items: { $ref: "#/components/schemas/Dish" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/DeliveryChannel" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/KitchenAlert" }
    KitchenAdvice:
      type: object
      required: [advice, generatedAt]
      properties:
        advice: { type: string }
        generatedAt: { type: string }

